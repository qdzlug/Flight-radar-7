services:
  merge:
    build:
      context: .
    container_name: flight-radar-merge
    restart: unless-stopped
    ports:
      - "${MERGE_PORT:-8000}:8000"
    environment:
      # Holding the OpenSky credentials here means the ESP32 never needs them:
      # point the device's data source at this service instead.
      OPENSKY_CLIENT_ID: "${OPENSKY_CLIENT_ID:-}"
      OPENSKY_CLIENT_SECRET: "${OPENSKY_CLIENT_SECRET:-}"
      OPENSKY_EXTENDED: "${OPENSKY_EXTENDED:-false}"
      ADSB_SOURCES: "${ADSB_SOURCES:-adsb.im,adsb.lol,adsb.fi}"
      ADSB_IM_URL: "${ADSB_IM_URL:-http://192.168.217.205/v2}"
      TAR1090_URL: "${TAR1090_URL:-}"
      MAX_STATES: "${MAX_STATES:-150}"
      CACHE_TTL_S: "${CACHE_TTL_S:-5}"
      STALE_GRACE_S: "${STALE_GRACE_S:-120}"
      ENRICHMENT_PROVIDER: "${ENRICHMENT_PROVIDER:-none}"
      ENRICHMENT_CACHE_PATH: "/app/data/enrichment.sqlite3"
      FLIGHTAWARE_API_KEY: "${FLIGHTAWARE_API_KEY:-}"
      ENRICHMENT_MAX_REQUESTS_PER_HOUR: "${ENRICHMENT_MAX_REQUESTS_PER_HOUR:-30}"
      ENRICHMENT_MAX_REQUESTS_PER_DAY: "${ENRICHMENT_MAX_REQUESTS_PER_DAY:-200}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes:
      - enrichment-data:/app/data

volumes:
  enrichment-data:
